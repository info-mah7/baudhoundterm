<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #10141c; overflow: hidden; }
  #screen { width: 100%; height: 100%; }
  #status {
    position: absolute; top: 0; left: 0; right: 0; padding: 6px 10px;
    font: 12px "Segoe UI", sans-serif; color: #dfe4ee; background: #1c2230;
    border-bottom: 1px solid #3a4459;
  }
  #status.gone { display: none; }
  /* A stalled VNC session is a sequence of events, and the status bar only ever shows the
     last one. This keeps the whole ordered story on screen until the desktop appears. */
  #log {
    position: absolute; top: 28px; left: 0; padding: 8px 10px;
    font: 11px Consolas, monospace; color: #9fb3d0; white-space: pre; line-height: 1.5;
  }
  #log.gone { display: none; }
</style>
</head>
<body>
<div id="status">Connecting...</div>
<div id="log"></div>
<div id="screen"></div>

<script>
const host = window.chrome && window.chrome.webview;
const send = (msg) => host && host.postMessage(JSON.stringify(msg));
const statusEl = document.getElementById('status');
const logEl = document.getElementById('log');
const t0 = Date.now();
const lines = [];

function log(text) {
  lines.push(((Date.now() - t0) / 1000).toFixed(2).padStart(6) + 's  ' + text);
  logEl.textContent = lines.slice(-16).join('\n');
}

log('page loaded, origin ' + location.origin);

// A script error here is otherwise invisible: navigation still completes, the page keeps its
// static "Connecting..." text, and nothing reaches the status bar. Report it instead.
const fail = (what) => { log('ERROR ' + what); say(what, true); send({ t: 'err', d: what }); };
window.addEventListener('error', e => fail(e.message || String(e.error) || 'script error'));
window.addEventListener('unhandledrejection', e => fail('' + (e.reason && e.reason.message || e.reason)));

function say(text, sticky) {
  statusEl.textContent = text;
  statusEl.classList.toggle('gone', !text);
  if (!sticky && text) setTimeout(() => statusEl.classList.add('gone'), 2500);
}

let rfb = null;
let RFB = null;

// The page is served from https://baudhound.assets while the bridge is ws://127.0.0.1, so a
// failure here can be the browser refusing the scheme rather than the bridge being absent.
// RFB swallows that distinction: both look like a socket that never opens. Probe once with a
// bare WebSocket first, report exactly how it ends, and only then hand the url to noVNC.
function probe(cfg) {
  log('probing ' + cfg.url);
  let settled = false;
  let ws;

  // The probe holds a real bridge connection, and the far end may allow only one viewer at a
  // time. So close it and let the target settle before noVNC opens its own, otherwise the
  // diagnostic is what breaks the session it is meant to diagnose.
  const done = (verdict) => {
    if (settled) return;
    settled = true;
    log('probe: ' + verdict);
    send({ t: 'probe', d: verdict });
    try { ws && ws.close(); } catch (e) {}
    setTimeout(() => { log('handing url to noVNC'); connect(cfg); }, 750);
  };

  try {
    ws = new WebSocket(cfg.url, 'binary');
  } catch (e) {
    done('constructor threw: ' + (e && e.message || e));
    return;
  }

  ws.onmessage = e => log('probe: first bytes from target, ' +
    (e.data && e.data.size !== undefined ? e.data.size + ' bytes' : typeof e.data));
  ws.onopen = () => log('probe: socket OPEN, subprotocol "' + ws.protocol + '"');
  ws.onerror = () => done('socket ERROR (readyState ' + ws.readyState + ')');
  ws.onclose = e => done('socket CLOSED code ' + e.code + ' "' + (e.reason || '') + '" clean=' + e.wasClean);
  // Give it long enough to open and receive the RFB greeting, then judge it a success.
  setTimeout(() => { if (ws.readyState === 1) done('open and healthy after 2s'); }, 2000);
}

function connect(cfg) {
  rfb = new RFB(document.getElementById('screen'), cfg.url, {
    credentials: cfg.username ? { username: cfg.username, password: cfg.password || '' } : { password: cfg.password || '' },
    // The far end owns its own clipboard and resolution; these are the settings that make
    // a desktop usable in a tab rather than a postage stamp.
    shared: true,
    wsProtocols: ['binary']
  });

  rfb.viewOnly = !!cfg.viewOnly;
  rfb.scaleViewport = true;
  rfb.resizeSession = false;
  rfb.clipViewport = false;
  rfb.background = '#10141c';

  rfb.addEventListener('connect', () => {
    log('rfb CONNECT');
    rfb.focus();   // the 'focus' from the host came before there was a session to focus
    logEl.classList.add('gone');
    say('Connected.', false);
    send({ t: 'vnc', s: 'connected' });
  });
  rfb.addEventListener('disconnect', e => {
    log('rfb DISCONNECT clean=' + !!e.detail.clean);
    say(e.detail.clean ? 'Disconnected.' : 'Connection lost.', true);
    send({ t: 'vnc', s: 'disconnected', clean: !!e.detail.clean });
  });
  rfb.addEventListener('credentialsrequired', () => {
    log('rfb CREDENTIALSREQUIRED types=' + JSON.stringify(rfb._rfbCredentials || null));
    say('This server wants a password.', true);
    send({ t: 'vnc', s: 'credentials' });
  });
  rfb.addEventListener('securityfailure', e => {
    log('rfb SECURITYFAILURE status=' + e.detail.status + ' reason=' + (e.detail.reason || ''));
    say('Rejected: ' + (e.detail.reason || 'security failure'), true);
    send({ t: 'vnc', s: 'failed', reason: e.detail.reason || '' });
  });
  rfb.addEventListener('desktopname', e => send({ t: 'title', d: e.detail.name }));
  rfb.addEventListener('clipboard', e => toLocal(e.detail.text));
}

// ---------- clipboard ----------
// noVNC carries the RFB clipboard messages but leaves this machine's clipboard to the page.
// Without this, Ctrl+V in the tab sends only the keystroke and the far end pastes its own
// clipboard. So Ctrl+V is caught before noVNC's canvas handler sees it, the local text goes
// over as ClientCutText, and only then is V pressed there (Ctrl is already down remotely).
// Classic RFB clipboard text is Latin-1: noVNC turns anything outside it into '?'.
document.addEventListener('keydown', e => {
  if (!rfb || rfb.viewOnly || e.code !== 'KeyV' || !e.ctrlKey || e.altKey || e.metaKey) return;
  e.preventDefault();
  e.stopImmediatePropagation();
  if (e.repeat) return;
  readLocalClipboard()
    .then(text => {
      if (!rfb) return;
      if (text) rfb.clipboardPasteFrom(text);
      // The server applies the cut text before it injects the key, but give it a moment. A quick
      // Ctrl+V has often let go of Ctrl by now, so press it again around the V if so.
      setTimeout(() => {
        if (!rfb) return;
        const wrap = !ctrlHeld;
        if (wrap) rfb.sendKey(0xffe3, 'ControlLeft', true);
        rfb.sendKey(0x76, 'KeyV', true);
        rfb.sendKey(0x76, 'KeyV', false);
        if (wrap) rfb.sendKey(0xffe3, 'ControlLeft', false);
      }, 50);
    });
}, true);

let ctrlHeld = false;
for (const type of ['keydown', 'keyup']) {
  document.addEventListener(type, e => { if (e.key === 'Control') ctrlHeld = type === 'keydown'; }, true);
}
window.addEventListener('blur', () => { ctrlHeld = false; });

// A copy on the far end lands here. Writing needs the page focused. A copy the user makes in
// this tab happens while it is focused and is written at once; one that arrives while the tab is
// not focused came from something else (an agent, another viewer, a program over there). It is
// written on the next focus only if it is a few seconds old: written later, it overwrote what the
// user had copied on this PC in the meantime, and Ctrl+V pasted a stale far-end line instead of
// their URL.
// The app does the clipboard work: navigator.clipboard read and wrote nothing inside WebView2.
let clipWaiter = null;
function readLocalClipboard() {
  if (!host) return Promise.resolve('');
  return new Promise(resolve => {
    clipWaiter = resolve;
    send({ t: 'clipget' });
    setTimeout(() => { if (clipWaiter === resolve) { clipWaiter = null; log('clipboard: no answer from the app'); resolve(''); } }, 1500);
  });
}

let pendingClip = null, pendingAt = 0;
function toLocal(text) {
  if (document.hasFocus()) { send({ t: 'clipset', text }); pendingClip = null; return; }
  pendingClip = text;
  pendingAt = Date.now();
}
window.addEventListener('focus', () => {
  if (pendingClip === null) return;
  if (Date.now() - pendingAt < 3000) send({ t: 'clipset', text: pendingClip });
  else log('far-end copy from ' + Math.round((Date.now() - pendingAt) / 1000) + ' s ago not written over this PC\'s clipboard');
  pendingClip = null;
});

host && host.addEventListener('message', ev => {
  const m = typeof ev.data === 'string' ? JSON.parse(ev.data) : ev.data;
  switch (m.t) {
    case 'vncinit':  log('host sent vncinit'); probe(m); break;
    case 'clip':     if (clipWaiter) { const w = clipWaiter; clipWaiter = null; w(m.text || ''); } break;
    case 'note':     log('bridge: ' + m.d); break;
    case 'viewonly': if (rfb) rfb.viewOnly = !!m.on; say(m.on ? 'View only.' : 'Input enabled.', false); break;
    case 'cad':      if (rfb) rfb.sendCtrlAltDel(); break;
    case 'focus':    if (rfb) rfb.focus(); break;
    case 'disconnect': if (rfb) rfb.disconnect(); break;
    case 'shot':     agentReply(m, () => shot(m)); break;
    case 'thumb':    agentReply(m, () => thumb()); break;
    case 'ptr':      agentReply(m, () => { mayAct(); RFB.messages.pointerEvent(rfb._sock, m.x, m.y, m.mask); return {}; }); break;
    case 'key':      agentReply(m, () => { mayAct(); rfb.sendKey(m.keysym, null, !!m.down); return {}; }); break;
  }
});

// ---------- agent: the eyes and hands of the built-in agent on this tab ----------
// The host asks with an id and gets {t:'agent', id, ok, ...} back. Pictures come from the
// framebuffer (display._backbuffer), not the scaled canvas on screen, so coordinates are the
// remote desktop's own pixels whatever the window size.

function agentReply(m, work) {
  let reply;
  try { reply = Object.assign({ t: 'agent', id: m.id, ok: true }, work()); }
  catch (e) { reply = { t: 'agent', id: m.id, ok: false, err: String(e && e.message || e) }; }
  send(reply);
}

function frame() {
  const fb = rfb && rfb._display && rfb._display._backbuffer;
  if (!fb || !fb.width || !fb.height) throw new Error('no picture yet: the session is not connected');
  return fb;
}

// The raw RFB senders skip noVNC's own view-only check, so it is made here.
function mayAct() {
  frame();
  if (rfb.viewOnly) throw new Error('this session is view only: the agent may look but not act');
}

// Whole screen or a region, scaled to at most maxw wide, optionally with a crosshair on one point
// (the click check asks the model what is there). The arms stop short of the point, so the label
// under it stays readable.
function shot(m) {
  const fb = frame();
  const x = Math.max(0, Math.min(fb.width - 1, m.x | 0)), y = Math.max(0, Math.min(fb.height - 1, m.y | 0));
  const w = Math.max(1, Math.min(fb.width - x, (m.w | 0) || fb.width)), h = Math.max(1, Math.min(fb.height - y, (m.h | 0) || fb.height));
  // A region (zoom, click check) is enlarged to fit maxw, up to 3x; the whole screen only ever shrinks.
  const fit = (m.maxw | 0) > 0 ? Math.min(m.maxw / w, m.maxw / h) : 1;
  const scale = Math.min((m.w | 0) > 0 ? 3 : 1, fit) || 1;
  const ow = Math.max(1, Math.round(w * scale)), oh = Math.max(1, Math.round(h * scale));
  const c = document.createElement('canvas');
  c.width = ow; c.height = oh;
  const g = c.getContext('2d');
  g.imageSmoothingQuality = 'high';
  g.drawImage(fb, x, y, w, h, 0, 0, ow, oh);
  if (m.mark) {
    const mx = (m.mark.x - x) * scale, my = (m.mark.y - y) * scale, r = Math.max(6, m.mark.r * scale);
    const gap = Math.max(8, r * 0.6), arm = gap + Math.max(14, r);
    for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      for (const [colour, width] of [['#ffffff', 5], ['#ff0000', 3]]) {
        g.strokeStyle = colour; g.lineWidth = width; g.beginPath();
        g.moveTo(mx + dx * gap, my + dy * gap); g.lineTo(mx + dx * arm, my + dy * arm); g.stroke();
      }
    }
  }
  const url = c.toDataURL('image/jpeg', 0.85);
  return { fw: fb.width, fh: fb.height, w: ow, h: oh, data: url.slice(url.indexOf(',') + 1) };
}

// 64x36 grey thumbnail, so the host can tell when the screen changed without moving pictures.
function thumb() {
  const fb = frame();
  const c = document.createElement('canvas');
  c.width = 64; c.height = 36;
  const g = c.getContext('2d');
  g.drawImage(fb, 0, 0, fb.width, fb.height, 0, 0, 64, 36);
  const px = g.getImageData(0, 0, 64, 36).data, grey = new Array(64 * 36);
  for (let i = 0; i < grey.length; i++) grey[i] = (px[i * 4] * 3 + px[i * 4 + 1] * 6 + px[i * 4 + 2]) / 10 | 0;
  return { fw: fb.width, fh: fb.height, grey };
}

// noVNC ships as ES modules, so it loads dynamically rather than with a static import: that
// puts the load inside a try/catch, and it lets the page announce itself only once RFB is in
// hand. The host starts the bridge on "ready", so by the time a url arrives, this is loadable.
import('./novnc/core/rfb.js')
  .then(m => { RFB = m.default; log('noVNC module loaded'); send({ t: 'ready', c: 0, r: 0 }); })
  .catch(e => fail('noVNC failed to load: ' + (e && e.message || e)));
</script>
</body>
</html>
