<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="xterm.css">
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #10141c; overflow: hidden; }
  #term { height: 100%; width: 100%; }
  #find {
    position: absolute; top: 8px; right: 18px; display: none; z-index: 10;
    background: #1c2230; border: 1px solid #3a4459; border-radius: 4px; padding: 4px;
    font: 12px "Segoe UI", sans-serif; color: #dfe4ee;
  }
  #find input { background: #10141c; border: 1px solid #3a4459; color: #dfe4ee; padding: 3px 6px; width: 200px; }
  #find button { background: #2a3245; border: 1px solid #3a4459; color: #dfe4ee; cursor: pointer; padding: 3px 7px; }

  /* Drawn in the page, not as a WPF menu over it: a native menu above the WebView never
     takes keyboard focus and renders in the system theme instead of this one. */
  #menu {
    position: absolute; display: none; z-index: 20; min-width: 210px; padding: 4px 0;
    background: #1c2230; border: 1px solid #3a4459; border-radius: 5px;
    box-shadow: 0 6px 20px rgba(0,0,0,.45);
    font: 13px "Segoe UI", sans-serif; color: #dfe4ee; user-select: none;
  }
  #menu .item { padding: 5px 14px; cursor: pointer; white-space: nowrap; }
  #menu .item:hover { background: #2f3b52; }
  #menu .item.disabled { color: #5c6370; cursor: default; }
  #menu .item.disabled:hover { background: transparent; }
  #menu .sep { height: 1px; margin: 4px 0; background: #3a4459; }
  #menu .hint { float: right; margin-left: 18px; color: #7c8aa0; font-size: 11px; }
</style>
</head>
<body>
<div id="term"></div>
<div id="find">
  <input id="findInput" placeholder="Find in scrollback" autocomplete="off">
  <button id="findPrev">&#9650;</button>
  <button id="findNext">&#9660;</button>
  <button id="findClose">&#10005;</button>
</div>
<div id="menu"></div>

<script src="xterm.js"></script>
<script src="addon-fit.js"></script>
<script src="addon-search.js"></script>
<script src="addon-web-links.js"></script>
<script src="addon-serialize.js"></script>
<script>
(function () {
  "use strict";

  const host = window.chrome && window.chrome.webview;
  const send = (msg) => host && host.postMessage(JSON.stringify(msg));

  const themes = {
    "Quarterdeck Dark": {
      background: "#10141c", foreground: "#dfe4ee", cursor: "#7fd6c1", selectionBackground: "#2f3b52",
      black: "#10141c", red: "#e06c75", green: "#98c379", yellow: "#e5c07b",
      blue: "#61afef", magenta: "#c678dd", cyan: "#56b6c2", white: "#dfe4ee",
      brightBlack: "#5c6370", brightRed: "#ff7b86", brightGreen: "#b5e08f", brightYellow: "#ffd68a",
      brightBlue: "#82c7ff", brightMagenta: "#dc9ff0", brightCyan: "#6fd3df", brightWhite: "#ffffff"
    },
    "Solarized Light": {
      background: "#fdf6e3", foreground: "#657b83", cursor: "#586e75", selectionBackground: "#eee8d5",
      black: "#073642", red: "#dc322f", green: "#859900", yellow: "#b58900",
      blue: "#268bd2", magenta: "#d33682", cyan: "#2aa198", white: "#eee8d5",
      brightBlack: "#002b36", brightRed: "#cb4b16", brightGreen: "#586e75", brightYellow: "#657b83",
      brightBlue: "#839496", brightMagenta: "#6c71c4", brightCyan: "#93a1a1", brightWhite: "#fdf6e3"
    },
    "Campbell": {
      background: "#0c0c0c", foreground: "#cccccc", cursor: "#ffffff", selectionBackground: "#3a3d41",
      black: "#0c0c0c", red: "#c50f1f", green: "#13a10e", yellow: "#c19c00",
      blue: "#0037da", magenta: "#881798", cyan: "#3a96dd", white: "#cccccc",
      brightBlack: "#767676", brightRed: "#e74856", brightGreen: "#16c60c", brightYellow: "#f9f1a5",
      brightBlue: "#3b78ff", brightMagenta: "#b4009e", brightCyan: "#61d6d6", brightWhite: "#f2f2f2"
    }
  };

  let term = null;
  let fit = null;
  let search = null;
  let serialize = null;
  let highlights = [];

  function init(cfg) {
    term = new Terminal({
      fontFamily: cfg.fontFamily + ', Consolas, monospace',
      fontSize: cfg.fontSize,
      scrollback: cfg.scrollback,
      cursorBlink: true,
      allowProposedApi: true,
      theme: themes[cfg.theme] || themes["Quarterdeck Dark"]
    });

    fit = new FitAddon.FitAddon();
    search = new SearchAddon.SearchAddon();
    serialize = new SerializeAddon.SerializeAddon();
    term.loadAddon(fit);
    term.loadAddon(search);
    term.loadAddon(serialize);
    term.loadAddon(new WebLinksAddon.WebLinksAddon());

    term.open(document.getElementById('term'));
    fit.fit();
    term.focus();

    term.onData(d => send({ t: 'in', d: d }));
    term.onResize(({ cols, rows }) => send({ t: 'size', c: cols, r: rows }));
    term.onTitleChange(title => send({ t: 'title', d: title }));

    // Copy on Ctrl+Shift+C, paste on Ctrl+Shift+V and on right-click, like SecureCRT's defaults.
    term.attachCustomKeyEventHandler(ev => {
      if (ev.type !== 'keydown') return true;

      // Returning false only stops xterm; the browser still acts on the key. Chromium reads
      // Ctrl+Shift+V as "paste as plain text", so without preventDefault the textarea got a
      // second, native paste: everything arrived twice. Ctrl+Shift+C with nothing selected
      // fell through to xterm as Ctrl+C and interrupted the running program.
      if (ev.ctrlKey && ev.shiftKey && ev.code === 'KeyC') {
        ev.preventDefault();
        const sel = term.getSelection();
        if (sel) { navigator.clipboard.writeText(sel); }
        return false;
      }
      if (ev.ctrlKey && ev.shiftKey && ev.code === 'KeyV') {
        ev.preventDefault();
        navigator.clipboard.readText()
          .then(t => t ? send({ t: 'in', d: t }) : send({ t: 'pasteimg' }))
          .catch(() => send({ t: 'pasteimg' }));
        return false;
      }
      if (ev.ctrlKey && ev.shiftKey && ev.code === 'KeyF') { ev.preventDefault(); openFind(); return false; }
      return true;
    });

    // Right-click hands off to the host, which shows the real menu (copy, paste, and this
    // session's command shortcuts). Shift+right-click keeps the old one-gesture paste.
    document.addEventListener('contextmenu', ev => {
      ev.preventDefault();

      if (ev.shiftKey) {
        const sel = term.getSelection();
        if (sel) { navigator.clipboard.writeText(sel); term.clearSelection(); }
        else { navigator.clipboard.readText().then(t => t && send({ t: 'in', d: t })); }
        return;
      }

      openMenu(ev.clientX, ev.clientY);
    });

    window.addEventListener('resize', () => { try { fit.fit(); } catch (e) {} });
    send({ t: 'ready', c: term.cols, r: term.rows });
  }

  // Highlight rules are applied to the incoming text, not to the rendered grid: xterm.js has no
  // public API for recolouring cells after the fact. A match split across two reads is missed.
  function applyHighlights(text) {
    if (!highlights.length) return text;
    let out = text;
    for (const h of highlights) {
      if (!h.enabled || !h.pattern) continue;
      try {
        const flags = h.caseSensitive ? 'g' : 'gi';
        const re = h.isRegex ? new RegExp(h.pattern, flags)
                             : new RegExp(h.pattern.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), flags);
        const sgr = (h.bold ? '\u001b[1m' : '') + '\u001b[38;2;' + hexToRgb(h.color) + 'm';
        out = out.replace(re, m => sgr + m + '\u001b[0m');
      } catch (e) { /* a bad user regex must not stop output */ }
    }
    return out;
  }

  function hexToRgb(hex) {
    const v = hex.replace('#', '');
    return [parseInt(v.substr(0,2),16), parseInt(v.substr(2,2),16), parseInt(v.substr(4,2),16)].join(';');
  }

  // ---- right-click menu ----

  let commands = [];          // [{label, confirm}] - the text itself stays host-side
  const menuEl = document.getElementById('menu');

  function closeMenu() { menuEl.style.display = 'none'; }

  function openMenu(x, y) {
    const sel = term.getSelection() || '';
    const rows = [
      { label: 'Copy', hint: 'Ctrl+Shift+C', disabled: !sel, run: () => {
          navigator.clipboard.writeText(sel); term.clearSelection(); } },
      { label: 'Paste', hint: 'Ctrl+Shift+V', run: () => {
          navigator.clipboard.readText()
            .then(t => t ? send({ t: 'in', d: t }) : send({ t: 'pasteimg' }))
            .catch(() => send({ t: 'pasteimg' })); } },
      { label: 'Paste image as file', run: () => send({ t: 'pasteimg' }) },
      { label: 'Clear screen', run: () => term.clear() }
    ];

    if (commands.length) {
      rows.push({ sep: true });
      commands.forEach((c, i) => rows.push({ label: c.label, run: () => send({ t: 'cmd', i: i }) }));
    }

    rows.push({ sep: true });
    rows.push({ label: 'Edit commands...', run: () => send({ t: 'editcmd' }) });

    menuEl.innerHTML = '';
    for (const row of rows) {
      if (row.sep) { const d = document.createElement('div'); d.className = 'sep'; menuEl.appendChild(d); continue; }
      const d = document.createElement('div');
      d.className = 'item' + (row.disabled ? ' disabled' : '');
      d.textContent = row.label;
      if (row.hint) { const h = document.createElement('span'); h.className = 'hint'; h.textContent = row.hint; d.appendChild(h); }
      if (!row.disabled) {
        d.addEventListener('mousedown', ev => { ev.preventDefault(); ev.stopPropagation(); closeMenu(); row.run(); });
      }
      menuEl.appendChild(d);
    }

    // Place it, then pull it back inside the window if it would hang off an edge.
    menuEl.style.display = 'block';
    menuEl.style.left = x + 'px';
    menuEl.style.top = y + 'px';
    const box = menuEl.getBoundingClientRect();
    if (box.right > window.innerWidth) menuEl.style.left = Math.max(0, window.innerWidth - box.width - 4) + 'px';
    if (box.bottom > window.innerHeight) menuEl.style.top = Math.max(0, window.innerHeight - box.height - 4) + 'px';
  }

  document.addEventListener('mousedown', ev => {
    if (!menuEl.contains(ev.target)) closeMenu();
  });
  document.addEventListener('keydown', ev => { if (ev.key === 'Escape') closeMenu(); }, true);

  function openFind() {
    const box = document.getElementById('find');
    box.style.display = 'block';
    document.getElementById('findInput').focus();
  }

  document.getElementById('findNext').onclick = () =>
    search.findNext(document.getElementById('findInput').value);
  document.getElementById('findPrev').onclick = () =>
    search.findPrevious(document.getElementById('findInput').value);
  document.getElementById('findClose').onclick = () => {
    document.getElementById('find').style.display = 'none';
    term.focus();
  };
  document.getElementById('findInput').addEventListener('keydown', ev => {
    if (ev.key === 'Enter') search.findNext(ev.target.value, { incremental: false });
    if (ev.key === 'Escape') document.getElementById('findClose').click();
  });

  // Messages from the host.
  host && host.addEventListener('message', ev => {
    const m = typeof ev.data === 'string' ? JSON.parse(ev.data) : ev.data;
    switch (m.t) {
      case 'init':       init(m); break;
      case 'out':        term && term.write(applyHighlights(m.d)); break;
      case 'highlights': highlights = m.rules || []; break;
      case 'commands':   commands = m.list || []; closeMenu(); break;
      case 'theme':      if (term) term.options.theme = themes[m.d] || themes["Quarterdeck Dark"]; break;
      case 'font':       if (term) { term.options.fontSize = m.size; fit.fit(); } break;
      case 'find':       openFind(); break;
      case 'clear':      term && term.clear(); break;
      case 'focus':      term && term.focus(); break;
      case 'fit':        try { fit.fit(); } catch (e) {} break;
      case 'selectAll':  term && term.selectAll(); break;
      case 'paste':      term && send({ t: 'in', d: m.d }); break;
      case 'dump':       send({ t: 'dump', d: serialize.serialize() }); break;
    }
  });
})();
</script>
</body>
</html>
